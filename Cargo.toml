[workspace]
members = ["crates/katrust", "crates/smartgame"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Andreas Lösel <andreas.loesel@outlook.com>"]
repository = "https://github.com/loeffner/katrust"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
missing_panics_doc = "warn"
